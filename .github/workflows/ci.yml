name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax and unit tests
        run: npm run verify
      - name: Assert no runtime connection APIs
        shell: bash
        run: |
          if grep -REn 'fetch[[:space:]]*\(|XMLHttpRequest|WebSocket[[:space:]]*\(|sendBeacon[[:space:]]*\(' src index.html; then
            echo "Unexpected network API in application runtime"
            exit 1
          fi
      - name: Assert strict connection policy
        shell: bash
        run: grep -Fq "connect-src 'none'" index.html
